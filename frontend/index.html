<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Text Extraction</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Image Text Extraction <span id="env-badge" class="env-badge" hidden></span></h1>
      <p class="subtitle">Upload a JPEG or PNG and get the text back out, via Amazon Textract.</p>
    </header>

    <section class="upload-panel">
      <label class="file-picker" for="file-input">
        <input type="file" id="file-input" accept="image/jpeg,image/png" />
        <span id="file-picker-label">Choose an image&hellip;</span>
      </label>
      <button id="upload-button" type="button" disabled>Upload &amp; extract</button>
      <p id="upload-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="result-panel" id="result-panel" hidden>
      <h2>Extracted text</h2>
      <pre id="result-text"></pre>
    </section>

    <section class="history-panel">
      <h2>History</h2>
      <ul id="history-list" class="history-list">
        <li class="history-empty">No extractions yet.</li>
      </ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
